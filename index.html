<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Rustline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: sans-serif;
        user-select: none;
      }
      #game-root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-canvas {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }
      #app {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .hud {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 0;
        pointer-events: none;
      }
      .energy-bar {
        width: 60%;
        max-width: 500px;
        height: 10px;
        background: #222;
        border: 1px solid #000;
        margin-bottom: 8px;
      }
      .energy-fill {
        height: 100%;
        background: #4fc3f7;
        width: 0%;
      }
      .deploy-bar {
        display: flex;
        gap: 6px;
        pointer-events: auto;
      }
      .deploy-btn {
        position: relative;
        width: 64px;
        height: 54px;
        background: #2e3440;
        border: 2px solid #4c566a;
        border-radius: 4px;
        color: #eceff4;
        font-size: 11px;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .deploy-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .deploy-btn .name,
      .deploy-btn .cost {
        position: relative;
        z-index: 1;
      }
      .deploy-btn .cost {
        color: #ffd166;
      }
      .deploy-btn .cooldown-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        height: 0%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.6);
        pointer-events: auto;
      }
      .overlay.hidden {
        display: none;
      }
      .overlay-message {
        font-size: 32px;
        color: #eceff4;
      }
      .restart-btn {
        padding: 10px 24px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas" width="960" height="540"></canvas>
      <div id="app"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
